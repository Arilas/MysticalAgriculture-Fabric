sourceSets.task5Gametest.runtimeClasspath =
        configurations.runtimeClasspath + sourceSets.task5Gametest.output

loom {
    mods {
        task5Gametest {
            sourceSet sourceSets.task5Gametest
        }
    }

    runs {
        task5FocusedGameTest {
            inherit server
            sourceSet = "task5Gametest"
            systemProperties.put "fabric-api.gametest", ""
            systemProperties.put "fabric-api.gametest.report-file",
                    layout.buildDirectory.file("test-results/task5-focused-gametest.xml").get().asFile.absolutePath
        }
    }
}

