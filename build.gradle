plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.12'
    id 'java-library'
    id 'maven-publish'
}

version = "${minecraft_version}-${mod_version}"
group = maven_group

base {
    archivesName = archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

repositories {
    mavenCentral()
}

sourceSets {
    task4Gametest {
        java.srcDirs = ["src/main/java", "src/task4Gametest/java"]
        java.include "com/blakebr0/mysticalagriculture/handler/MachineItemStorage.java"
        java.include "com/blakebr0/mysticalagriculture/task4gametest/**"
    }
}

loom {
    accessWidenerPath = file("src/main/resources/mysticalagriculture.accesswidener")

    mods {
        task4Gametest {
            sourceSet sourceSets.task4Gametest
        }
    }

    runs {
        task4FocusedGameTest {
            inherit server
            sourceSet = "task4Gametest"
            systemProperties.put "fabric-api.gametest", ""
        }
    }
}

fabricApi {
    configureDataGeneration {
        modId = "mysticalagriculture"
        outputDirectory = file("src/generated/resources")
        createRunConfiguration = true
    }
    configureTests {
        createSourceSet = true
        modId = "mysticalagriculture-gametest"
        enableGameTests = true
        enableClientGameTests = false
    }
}

sourceSets.main.resources {
    exclude ".cache"
}

sourceSets {
    apiSurface {
        java.srcDir "src/main/java"
        java.include "com/blakebr0/mysticalagriculture/api/IMysticalAgriculturePlugin.java"
        java.include "com/blakebr0/mysticalagriculture/api/MysticalAgricultureAPI.java"
        java.include "com/blakebr0/mysticalagriculture/api/MysticalAgricultureConfigValues.java"
        java.include "com/blakebr0/mysticalagriculture/api/MysticalAgricultureDataComponentTypes.java"
        java.include "com/blakebr0/mysticalagriculture/api/MysticalAgriculturePlugin.java"
        java.include "com/blakebr0/mysticalagriculture/api/MysticalAgricultureTags.java"
        java.include "com/blakebr0/mysticalagriculture/api/components/**"
        java.include "com/blakebr0/mysticalagriculture/api/crafting/**"
        java.include "com/blakebr0/mysticalagriculture/api/crop/**"
        java.include "com/blakebr0/mysticalagriculture/api/farmland/**"
        java.include "com/blakebr0/mysticalagriculture/api/lib/AbilityCache.java"
        java.include "com/blakebr0/mysticalagriculture/api/lib/LazyIngredient.java"
        java.include "com/blakebr0/mysticalagriculture/api/lib/PluginConfig.java"
        java.include "com/blakebr0/mysticalagriculture/api/registry/**"
        java.include "com/blakebr0/mysticalagriculture/api/soul/**"
        java.include "com/blakebr0/mysticalagriculture/api/tinkering/**"
    }

    apiCompatibility {
        java.srcDir "src/apiCompatibility/java"
    }
}

configurations {
    apiSurfaceImplementation.extendsFrom implementation
    apiCompatibilityImplementation.extendsFrom implementation
    task4GametestImplementation.extendsFrom implementation
    task3LoaderRuntime {
        canBeConsumed = false
        canBeResolved = true
        extendsFrom testRuntimeClasspath
    }
}

sourceSets.apiSurface.compileClasspath = configurations.compileClasspath
sourceSets.task4Gametest.compileClasspath = configurations.compileClasspath
sourceSets.task4Gametest.runtimeClasspath =
        configurations.runtimeClasspath + sourceSets.task4Gametest.output

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "com.blakebr0.cucumber:Cucumber-Fabric:${cucumber_version}"

    api "teamreborn:energy:${energy_version}"
    include "teamreborn:energy:${energy_version}"

    testImplementation platform("org.junit:junit-bom:5.12.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    task3LoaderRuntime "net.fabricmc:fabric-loader-junit:${fabric_loader_version}"
}

java.withSourcesJar()

tasks.register('apiJar', Jar) {
    from(sourceSets.apiSurface.output)

    archiveClassifier = 'api'
}

sourceSets.apiCompatibility.compileClasspath =
        files(tasks.named('apiJar')) + configurations.compileClasspath

tasks.named('compileApiCompatibilityJava') {
    dependsOn tasks.named('apiJar')
}

