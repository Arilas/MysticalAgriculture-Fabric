    options.compilerArgs += ["-implicit:none"]
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.register('compileTask6TestJava', JavaCompile) {
    dependsOn tasks.named('compileTask6Java')
    source fileTree("src/test/java/com/blakebr0/mysticalagriculture/client") {
        include "**/*Test.java"
    }
    classpath = configurations.testCompileClasspath + files(task6MainOutput)
    destinationDirectory = task6TestOutput
    options.sourcepath = files("src/test/java")
    options.compilerArgs += ["-implicit:none"]
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.register('task6Test', Test) {
    dependsOn tasks.named('compileTask6TestJava')
    testClassesDirs = files(task6TestOutput)
    classpath = configurations.testRuntimeClasspath + files(task6MainOutput, task6TestOutput)
    systemProperty "task6AssetsDir", file("src/main/resources/assets/mysticalagriculture").absolutePath
    useJUnitPlatform()
}

sourceSets {
    task6Client {
        java.srcDirs = []
        resources.srcDirs = ["src/main/resources", "src/generated/resources"]
    }
}

configurations {
    task6ClientImplementation.extendsFrom implementation
}

sourceSets.task6Client.compileClasspath =
        configurations.compileClasspath + files(task6MainOutput)
sourceSets.task6Client.output.dir(task6MainOutput, builtBy: tasks.named('compileTask6Java'))
sourceSets.task6Client.runtimeClasspath =
        configurations.runtimeClasspath + sourceSets.task6Client.output

loom {
    mods {
        task6Client {
            sourceSet sourceSets.task6Client
        }
    }

    runs {
