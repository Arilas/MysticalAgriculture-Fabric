tasks.register('compileTask2TestJava', JavaCompile) {
    source file("src/test/java/com/blakebr0/mysticalagriculture/registry/PluginRegistryTest.java")
    classpath = configurations.testCompileClasspath
    destinationDirectory = task2TestOutput
    options.sourcepath = files("src/main/java", "src/test/java")
    options.compilerArgs += ["-implicit:class"]
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.register('task2Test', Test) {
    dependsOn tasks.named('compileTask2TestJava'), tasks.named('apiJar')
    testClassesDirs = files(task2TestOutput)
    classpath = configurations.testRuntimeClasspath + files(task2TestOutput)
    systemProperty "apiCompatibilityClasspath", sourceSets.apiCompatibility.compileClasspath.asPath
    useJUnitPlatform()
}

