plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.12'
    id 'java-library'
    id 'maven-publish'
}

version = "${minecraft_version}-${mod_version}"
group = maven_group

base {
    archivesName = archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

repositories {
    mavenCentral()
}

loom {
    accessWidenerPath = file("src/main/resources/mysticalagriculture.accesswidener")
}

fabricApi {
    configureDataGeneration {
        modId = "mysticalagriculture"
        outputDirectory = file("src/generated/resources")
        createRunConfiguration = true
    }
    configureTests {
        createSourceSet = true
        modId = "mysticalagriculture-gametest"
        enableGameTests = true
        enableClientGameTests = false
    }
}

sourceSets.main.resources {
    exclude ".cache"
}

sourceSets {
    apiCompatibility {
        java.srcDir "src/apiCompatibility/java"
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
    }
}

configurations {
    apiCompatibilityImplementation.extendsFrom implementation
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "com.blakebr0.cucumber:Cucumber-Fabric:${cucumber_version}"

    api "teamreborn:energy:${energy_version}"
    include "teamreborn:energy:${energy_version}"

    testImplementation platform("org.junit:junit-bom:5.12.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

java.withSourcesJar()

tasks.register('apiJar', Jar) {
    from(sourceSets.main.output) {
        include 'com/blakebr0/mysticalagriculture/api/**'
    }

    archiveClassifier = 'api'
}

artifacts {
    archives apiJar
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            mod_version: mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['fabric.mod.json']) {
        expand replaceProperties
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.named('check') {
    dependsOn tasks.named('compileApiCompatibilityJava')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}
