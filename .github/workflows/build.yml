name: Build

on:
  push:
    branches:
      - fabric/26.2
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Cucumber Fabric
        uses: actions/checkout@v7
        with:
          repository: Arilas/Cucumber
          ref: fabric/26.2
          path: Cucumber-Fabric
          persist-credentials: false

      - name: Check out Mystical Agriculture Fabric
        uses: actions/checkout@v7
        with:
          path: MysticalAgriculture
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        working-directory: MysticalAgriculture
        run: ./gradlew clean build

      - name: Run production server and client GameTests
        working-directory: MysticalAgriculture
        run: |
          ./gradlew runGameTest
          xvfb-run --auto-servernum ./gradlew runClientGameTest

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: MysticalAgriculture-Fabric-26.2
          if-no-files-found: error
          path: |
            MysticalAgriculture/build/libs/MysticalAgriculture-Fabric-26.2-9.0.4+fabric.1.jar
            MysticalAgriculture/build/libs/MysticalAgriculture-Fabric-26.2-9.0.4+fabric.1-sources.jar
